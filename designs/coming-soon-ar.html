<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قريباً — AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --green:#1f6b4f; --gold:#c9a25f; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Almarai',sans-serif; background:#d9d5cd; min-height:100vh;
    display:grid; place-items:center; padding:40px 20px; -webkit-font-smoothing:antialiased; }
  .frame{ width:380px; border-radius:22px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.22); }
  .poster{ height:675px; position:relative; color:#fff; background-size:cover; background-position:center;
    background-image:linear-gradient(180deg,rgba(40,20,30,.25),rgba(30,20,25,.15) 55%,rgba(20,15,15,.85)),
      url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?q=80&w=1200&auto=format&fit=crop');
    display:flex; flex-direction:column; align-items:center; padding:46px 30px 0; text-align:center; }
  .poster .bico{ width:46px; height:46px; stroke:#fff; fill:none; stroke-width:1.4; }
  .poster .kicker{ letter-spacing:6px; font-weight:700; font-size:15px; margin-top:10px; }
  .poster h2{ font-weight:800; font-size:72px; line-height:.95; margin-top:26px;
    text-transform:uppercase; letter-spacing:1px; }
  .poster .desc{ font-weight:700; font-size:25px; line-height:1.4; margin-top:22px; max-width:300px; }
  .poster .cta-pill{ position:absolute; bottom:70px; left:30px; right:30px; background:var(--green);
    color:#fff; font-weight:800; font-size:21px; padding:18px; border-radius:99px; text-align:center; }
  .poster .pfoot{ position:absolute; bottom:18px; left:0; right:0; display:flex; align-items:center;
    gap:10px; justify-content:center; font-size:13.5px; font-weight:700; color:#eee; }
  .poster .pfoot .shield{ width:17px; height:17px; fill:var(--gold); }
</style>
</head>
<body>
  <div class="frame">
    <div class="poster">
      <svg class="bico" viewBox="0 0 24 24"><path d="M4 21V7l7-4 7 4v14M9 21v-4h2v4M9 9h2M9 13h2M14 9h0M14 13h0"/></svg>
      <div class="kicker">REAL ESTATE</div>
      <h2>Coming<br>Soon</h2>
      <div class="desc">مشروع سكني فاخر<br>يعيد تعريف الحياة العصرية</div>
      <div class="cta-pill">سجّل اهتمامك المبكر</div>
      <div class="pfoot">
        <svg class="shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z"/></svg>
        رخصة فال: 1100001234 &nbsp;•&nbsp; ترخيص الإعلان: 7200123456
      </div>
    </div>
  </div>
</body>
</html>
